name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please include enough detail to reproduce it.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I can reproduce this with the latest version or current `master`.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run `fo ...`
        2. See ...
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: Paste the exact command you ran, redacting private paths if needed.
      placeholder: fo ~/Downloads --dry-run
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Paste `fo --help` version output if available, or the commit SHA.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, uv version, Ollama version, and model names.
      placeholder: |
        OS:
        Python:
        uv:
        Ollama:
        Models:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant terminal output. Redact private paths, filenames, or secrets.
      render: text
